[package]
name = "voter-stake-registry"
version = "0.2.4"
description = "a voter weight plugin for spl-governance"
license = "GPL-3.0-or-later"
homepage = "https://github.com/blockworks-foundation/voter-stake-registry"
edition = "2018"

[lib]
crate-type = ["cdylib", "lib"]
name = "voter_stake_registry"
doctest = false

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
cpi = ["no-entrypoint"]
default = []
localnet = []
test-sbf = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1" }
spl-governance = { package = "spl-governance-mythic", version = "3.1.2", features = ["no-entrypoint"] }
spl-governance-addin-api = { package = "spl-governance-addin-api-mythic", version = "0.1.6" }
# The governance crates use borsh 1, while anchor-lang 0.31 still uses borsh 0.10
borsh1 = { package = "borsh", version = "1.5.1" }
solana-program = "=2.2.1"
static_assertions = "1.1"
bytemuck = { version = "1.9.1", features = ["derive", "min_const_generics"] }

[dev-dependencies]
solana-sdk = "=2.2.1"
solana-program-test = "=2.2.1"
solana-logger = "=2.2.1"
spl-token = { version = "6", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "4", features = ["no-entrypoint"] }
bytemuck = "1.7"
serde = "^1.0"
bincode = "^1.3.1"
log = "0.4.14"
env_logger = "0.9.0"
base64 = "0.13.0"
